[project]
name = "coeffinance"
version = "0.1.0"
description = "Expert system for ratio financial analysis of business."
readme = "README.md"

requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.14",
    "aiosmtplib>=4.0.1",
    "alembic>=1.16.4",
    "alembic-postgresql-enum>=1.8.0",
    "asgi-correlation-id>=4.3.4",
    "asgi-lifespan>=2.1.0",
    "asyncpg>=0.30.0",
    "cadwyn[standard]>=5.6.1",
    "dishka>=1.6.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.11",
    "fastapi-pagination>=0.14.0",
    "fastapi-users[redis,sqlalchemy]>=14.0.1",
    "httpx>=0.28.1",
    "limits>=5.6.0",
    "pydantic-extra-types>=2.10.2",
    "pydantic-settings>=2.8.1",
    "redis-semaphore-async>=0.0.4",
    "semver>=3.0.4",
    "sqlakeyset>=2.0.1746777265",
    "sqlalchemy-utils>=0.42.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "uvicorn>=0.34.0",
    "zxcvbn>=4.5.0",
]

[dependency-groups]
dev = [
    "asgiref>=3.11.0",
    "asyncpg-stubs>=0.30.1",
    "datamodel-code-generator>=0.35.0",
    "mypy>=1.15.0",
    "pyright>=1.1.404",
    "ruff>=0.9.10",
    "types-redis>=4.6.0.20241004",
    "types-zxcvbn>=4.5.0.20250809",
]
test = [
    "polyfactory>=2.22.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-icdiff>=0.9",
    "testcontainers[postgres]>=4.13.0",
]

[tool.alembic]
script_location = "%(here)s/src/core/infrastructure/alembic"
prepend_sys_path = [
    ".",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
]

[tool.mypy]
exclude = [
    "src/core/infrastructure/alembic/versions",
]
disable_error_code = [
    "valid-type",
]

strict = true
# Enables most rules that are not even included in strict mode.
warn_unreachable = true
warn_incomplete_stub = true

plugins = [
    'pydantic.mypy',
]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
# The lib is de facto typed: https://github.com/testcontainers/testcontainers-python/issues/305.
follow_untyped_imports = true

[tool.pyright]
exclude = [
    "**/.*",
    "**/.*/**",
    "**/__pycache__",
    "src/core/infrastructure/alembic/versions",
]
reportInvalidTypeForm = false

# Separates MyPy ignores, as this type checker does not have a narrowed
# directive such as «mypy: ignore».
enableTypeIgnoreComments = false

typeCheckingMode = "strict"
# Enables most rules that are not even included in strict mode.
deprecateTypingAliases = true
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportPropertyTypeMismatch = "error"
reportShadowedImports = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"

# Due to the presence of many third-party libraries with a minor lack of typing.
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownVariableType = false
reportUnknownMemberType = false

[tool.ruff]
line-length = 80

exclude = [
    "src/core/infrastructure/alembic/versions",
]

[tool.ruff.lint]
select = [
    "ALL",
]

ignore = [
    "ARG",
    "D",
    "EM",

    "ANN401",
    "COM812",
    "RUF002",
    "S101",
    "TRY003",

    "TD002",
    "TD003",
    "TD004",
    "FIX002",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "dishka.provider.provider.Provider",
]

[tool.datamodel-codegen]
additional-imports = "datetime.date,datetime.datetime"

formatters = [
    "ruff-check",
    "ruff-format",
]

base-class = "src.core.schemas.Schema"
enum-field-as-literal = "one"
use-annotated = true
use-generic-container-types = true
use-non-positive-negative-number-constrained-types = true
use-standard-collections = true
use-subclass-enum = true
use-union-operator = true
use-unique-items-as-set = true

capitalise-enum-members = true
use-field-description = true
use-schema-description = true
